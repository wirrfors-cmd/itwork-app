workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      node: 18.17.0

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @capacitor/cli

      - name: Build web assets
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild build -scheme App -workspace App.xcworkspace -configuration Release -derivedDataPath build

      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -archivePath "build/App.xcarchive" \
            archive

          xcodebuild -exportArchive \
            -archivePath "build/App.xcarchive" \
            -exportOptionsPlist "exportOptions.plist" \
            -exportPath "build/ipa" \
            -allowProvisioningUpdates

    artifacts:
      - ios/App/build/ipa/**/*.ipa
      - ios/App/build/App.xcarchive

    publishing:
      email:
        recipients:
          - wirrfors@googlemail.com
        notify:
          success: true
          failure: true
